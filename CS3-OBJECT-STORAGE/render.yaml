services:
  - type: web
    name: cs3-object-storage
    runtime: python
    region: frankfurt
    plan: 1c-2g
    rootDir: CS3-OBJECT-STORAGE-SERVER
    buildCommand: python -m pip install --disable-pip-version-check -r requirements.txt && ./render-build.sh
    startCommand: ./render-start.sh
    disk:
      name: cs3-object-storage-data
      mountPath: /opt/render/project/src/CS3-OBJECT-STORAGE-SERVER/data
      sizeGB: 20
    envVars:
      - key: GARAGE_DEFAULT_ACCESS_KEY
        sync: false
      - key: GARAGE_DEFAULT_SECRET_KEY
        sync: false
      - key: GARAGE_DEFAULT_BUCKET
        value: majiscope-report-media
      - key: CS3_STORAGE_ROOT
        value: /opt/render/project/src/CS3-OBJECT-STORAGE-SERVER/data
      - key: CS3_UI_PASSPHRASE
        sync: false
      - key: CS3_UI_BIND_ADDRESS
        value: 0.0.0.0
    healthCheckPath: /
